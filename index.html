<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서출구의 iPhone</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .phone {
    width: 360px; height: 720px; background: #000; border-radius: 44px;
    padding: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.5), inset 0 0 0 2px #333;
    position: relative;
  }
  .screen {
  width: 100%;
  height: 100%;
  background: #f2f2f7;
  border-radius: 34px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
  .notch {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 112px;
  height: 30px;
  background: #000;
  border-radius: 20px;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 12px;
}

/* 전면 카메라 렌즈 */
.notch::after {
  content: "";
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    #52617b 0%,
    #182338 35%,
    #050505 75%
  );
  border: 1px solid #202020;
  box-shadow: 0 0 2px rgba(100, 140, 255, 0.4);
}

  .content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  position: relative;
  display: flex;
  flex-direction: column;
  padding-top: 44px;
  box-sizing: border-box;
}
  .content::-webkit-scrollbar { display: none; }

  /* 홈 화면 (아이폰 스타일) */
  .home {
    min-height: 100%; padding: 16px 18px 0; position: relative;
    background: transparent;
  }
  .home .widget { margin: 22px 4px 6px; text-align: center; color: #222; }
  .home .widget .date { font-size: 13px; font-weight: 600; color: #444; }
  .home .widget .time { font-size: 46px; font-weight: 300; line-height: 1.1; }
  .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 6px; margin-top: 28px; justify-items: center; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; width: 66px; }
  .app .icon {
    width: 60px; height: 60px; border-radius: 14px; display: flex;
    align-items: center; justify-content: center; font-size: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: transform .15s; overflow: hidden;
  }
  .app:active .icon { transform: scale(.9); }
  .app span { font-size: 11px; color: #222; white-space: nowrap; }
  .pagedots { position: absolute; left: 0; right: 0; bottom: 122px; display: flex; justify-content: center; gap: 6px; }
  .pagedots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,.2); }
  .pagedots i.on { background: #444; }
  .dock {
    position: absolute; left: 10px; right: 10px; bottom: 26px; height: 84px;
    background: rgba(255,255,255,.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 28px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; justify-items: center;
  }
  .dock .app span { display: none; }
  .dock .app .icon { width: 58px; height: 58px; }

  /* 공통 헤더 */
  .header {
  min-height: 48px;
  padding: 8px 12px;
  background: rgba(248, 248, 250, 0.96);
  border-bottom: 1px solid #d1d1d6;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.header .back {
  color: #007aff;
  font-size: 17px;
  cursor: pointer;
  padding: 4px 0;
  white-space: nowrap;
}

.header .title {
  font-size: 17px;
  font-weight: 600;
  flex: 1;
  text-align: center;
  margin-right: 55px;
}

  /* 문자 */
  .thread {
    display: flex; gap: 12px; padding: 12px 16px; background: #fff;
    border-bottom: 1px solid #eee; cursor: pointer;
  }
  .thread:active { background: #e5e5ea; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; color: #fff; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px;
  }
  .thread .info { flex: 1; min-width: 0; }
  .thread .row { display: flex; justify-content: space-between; align-items: center; }
  .thread .name { font-weight: 600; font-size: 15px; }
  .thread .time { font-size: 12px; color: #8e8e93; }
  .thread .preview { font-size: 13px; color: #8e8e93; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chat {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
  .bubble {
  display: block;
  width: fit-content;
  max-width: 75%;
  padding: 9px 13px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.4;
  word-break: keep-all;
  overflow: visible;
  overflow-wrap: break-word;
  height: auto;
  max-height: none;
}
  .bubble.them { background: #e9e9eb; color: #000; align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.me { background: #007aff; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .stamp { text-align: center; font-size: 11px; color: #8e8e93; margin: 10px 0 4px; }

  /* 메모 */
  .note-item { background: #fff; padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
  .note-item:active { background: #e5e5ea; }
  .note-item .t { font-weight: 600; font-size: 15px; }
  .note-item .d { font-size: 12px; color: #8e8e93; margin: 2px 0 4px; }
  .note-item .p { font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-body { background: #fffbea; padding: 18px 20px; min-height: 100%; font-size: 15px; line-height: 1.7; white-space: pre-wrap; color: #333; }
  .note-body .nd { font-size: 12px; color: #aaa; margin-bottom: 10px; }

  /* 사진 */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; }
  .photo {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 38px; cursor: pointer; position: relative;
  }
  .photo .cap { position: absolute; bottom: 0; left: 0; right: 0; font-size: 10px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.45)); padding: 12px 4px 3px; text-align: center; }
  .viewer { background: #000; flex: 1; display: flex; flex-direction: column; }
  .viewer .big { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 110px; }
  .viewer .meta { color: #ddd; padding: 14px 18px; font-size: 13px; background: #111; line-height: 1.6; }
  .viewer .meta b { color: #fff; }

  .hint {
    position: absolute; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: #999; pointer-events: none;
  }
  .homebar {
    width: 120px; height: 5px; background: #111; border-radius: 3px;
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); cursor: pointer; z-index: 20;
  }

/* iOS-inspired system app iconography */
.app .icon { position: relative; font-size: 0; isolation: isolate; }
.app .icon::before, .app .icon::after { position: absolute; content: ""; display: block; }
.app .icon { border-radius: 14px; overflow: hidden; }
.apps .app:nth-child(1) .icon, .dock .app:nth-child(1) .icon { background: linear-gradient(145deg,#43e879,#08b84b) !important; }
.apps .app:nth-child(2) .icon { background: linear-gradient(145deg,#fff8ad,#ffd52a) !important; }
.apps .app:nth-child(3) .icon { background: linear-gradient(145deg,#ff9a9e,#f857a6) !important; }
.apps .app:nth-child(4) .icon { background: linear-gradient(145deg,#8fd3ff,#2584ff) !important; }
.dock .app:nth-child(2) .icon { background: linear-gradient(145deg,#69d7ff,#1685ed) !important; }
.dock .app:nth-child(3) .icon { background: linear-gradient(145deg,#6ff58d,#16c95a) !important; }
.dock .app:nth-child(4) .icon { background: linear-gradient(145deg,#ff7bb0,#f04481) !important; }
/* White handset, compass, message bubble, music note */
.dock .app:nth-child(1) .icon::before {
  content:""; width:28px; height:28px; left:16px; top:15px; border:5px solid #fff;
  border-top-color:transparent; border-right-color:transparent; border-radius:50%;
  transform:rotate(-35deg);
}
.dock .app:nth-child(1) .icon::after {
  width:11px; height:8px; left:12px; top:14px; background:#fff; border-radius:3px;
  box-shadow:20px 22px 0 -1px #fff; transform:rotate(-38deg);
}
.dock .app:nth-child(2) .icon::before {
  inset:10px; border-radius:50%; background:#fff; border:2px solid rgba(255,255,255,.85);
}
.dock .app:nth-child(2) .icon::after {
  width:0;height:0;left:25px;top:12px;border-left:6px solid transparent;border-right:6px solid transparent;
  border-bottom:24px solid #1685ed; transform:rotate(32deg);
  filter:drop-shadow(0 0 1px #fff);
}
.dock .app:nth-child(3) .icon::before {
  width:36px;height:25px;left:11px;top:16px;background:#fff;border-radius:8px;
}
.dock .app:nth-child(3) .icon::after {
  width:10px;height:10px;left:16px;top:34px;background:#fff;transform:rotate(35deg);border-radius:2px;
}
.dock .app:nth-child(4) .icon::before {
  width:12px;height:32px;left:24px;top:12px;background:#fff;border-radius:3px 3px 6px 6px;
  transform:rotate(-8deg);
}
.dock .app:nth-child(4) .icon::after {
  width:17px;height:7px;left:24px;top:11px;background:#fff;border-radius:3px;transform:rotate(-8deg);
}
/* Settings gear */
.apps .app:nth-child(7) .icon { background:linear-gradient(145deg,#aeb2b8,#686d75) !important; }
.apps .app:nth-child(7) .icon::before {
  width:27px;height:27px;left:16px;top:16px;border:5px solid #f7f7f7;border-radius:50%;
  box-shadow:0 0 0 4px rgba(255,255,255,.16);
}
.apps .app:nth-child(7) .icon::after {
  width:9px;height:9px;left:25px;top:25px;background:#f7f7f7;border-radius:50%;
  box-shadow:0 -19px 0 -2px #f7f7f7,0 19px 0 -2px #f7f7f7,19px 0 0 -2px #f7f7f7,-19px 0 0 -2px #f7f7f7,
  13px 13px 0 -2px #f7f7f7,-13px -13px 0 -2px #f7f7f7,13px -13px 0 -2px #f7f7f7,-13px 13px 0 -2px #f7f7f7;
}
/* Calendar, photos and notes get app-like pictograms */
.apps .app:nth-child(2) .icon::before {
  content:"29"; font:700 25px -apple-system,BlinkMacSystemFont,sans-serif;color:#222;
  left:0;right:0;top:20px;text-align:center;background:#fff;height:40px;padding-top:4px;
}
.apps .app:nth-child(2) .icon::after {
  content:"토요일";font:600 8px -apple-system,BlinkMacSystemFont,sans-serif;color:#f44;
  left:0;right:0;top:5px;text-align:center;background:#fff;height:16px;
}
.apps .app:nth-child(3) .icon { background:#fff !important; }
.apps .app:nth-child(3) .icon::before {
  width:23px;height:23px;left:18px;top:8px;border-radius:50%;
  background:conic-gradient(#ff453a 0 45deg,#ffd60a 45deg 90deg,#30d158 90deg 135deg,#64d2ff 135deg 180deg,#0a84ff 180deg 225deg,#bf5af2 225deg 270deg,#ff375f 270deg 315deg,#ff9f0a 315deg);
}
.apps .app:nth-child(3) .icon::after {
  width:23px;height:23px;left:18px;top:29px;border-radius:50%;
  background:conic-gradient(#ff453a,#ffd60a,#30d158,#64d2ff,#0a84ff,#bf5af2,#ff375f,#ff9f0a);
}
.apps .app:nth-child(1) .icon::before {
  width:29px;height:22px;left:15px;top:19px;border-radius:5px;background:#fff;
}
.apps .app:nth-child(1) .icon::after {
  width:0;height:0;left:25px;top:21px;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:12px solid #39d66a;
}
.apps .app:nth-child(8) .icon { background:#fff !important; }
.apps .app:nth-child(8) .icon::before {
  content:"";left:12px;right:12px;top:10px;height:40px;border-radius:4px;
  background:linear-gradient(to bottom,#ff453a 0 8px,#fff 8px 100%);border:1px solid #ddd;
}
.apps .app:nth-child(8) .icon::after {
  content:"18";font:700 23px -apple-system,BlinkMacSystemFont,sans-serif;color:#222;left:0;right:0;top:21px;text-align:center;
}

  /* 문자 입력창 */
.message-input-area {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: #f8f8fa;
  border-top: 1px solid #e5e5ea;
  flex-shrink: 0;
}

.message-input {
  flex: 1;
  min-width: 0;
  border: 1px solid #d1d1d6;
  border-radius: 22px;
  padding: 10px 14px;
  font-size: 14px;
  outline: none;
  background: white;
}

.message-input:focus {
  border-color: #007aff;
}

.send-button {
  border: none;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  background: #007aff;
  color: white;
  font-size: 19px;
  cursor: pointer;
  flex-shrink: 0;
}

.send-button:active {
  opacity: 0.7;
}

  .statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  padding: 12px 24px 0;
  box-sizing: border-box;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
  color: #000;
  z-index: 100;
  background: transparent;
  flex-shrink: 0;
}


.status-icons {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 17px;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 13px;
}

.signal i {
  display: block;
  width: 3px;
  background: #000;
  border-radius: 1px;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 7px; }
.signal i:nth-child(3) { height: 10px; }
.signal i:nth-child(4) { height: 13px; }

.wifi {
  width: 17px;
  height: 15px;
  fill: none;
  stroke: #000;
  stroke-width: 2.5;
  stroke-linecap: round;
}

.battery {
  width: 24px;
  height: 12px;
  border: 1.5px solid #000;
  border-radius: 3px;
  padding: 2px;
  position: relative;
  margin-left: 1px;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 3px;
  width: 2px;
  height: 4px;
  background: #000;
  border-radius: 0 2px 2px 0;
}

.battery-level {
  display: block;
  width: 79%;
  height: 100%;
  background: #000;
  border-radius: 1px;
}

  .weather-screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  color: #fff;
  text-align: center;
  padding: 12px 16px 28px;
  background: transparent;
  scrollbar-width: none;
}

.weather-screen::-webkit-scrollbar {
  display: none;
}

.weather-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 36px;
  margin-bottom: 12px;
}

.weather-nav button {
  border: 0;
  background: rgba(255,255,255,.16);
  color: white;
  border-radius: 50%;
  width: 32px;
  height: 32px;
  font-size: 20px;
  cursor: pointer;
}

.weather-nav-label {
  font-size: 13px;
  font-weight: 500;
  opacity: .95;
}

.weather-main-city {
  font-size: 31px;
  font-weight: 400;
  letter-spacing: -.7px;
  margin-top: 5px;
}

.weather-main-desc {
  font-size: 16px;
  margin-top: 3px;
  color: rgba(255,255,255,.92);
}

.weather-main-temp {
  font-size: 82px;
  line-height: 1.12;
  font-weight: 200;
  letter-spacing: -5px;
  margin: 0;
}

.weather-high-low {
  font-size: 15px;
  font-weight: 500;
  margin-top: 1px;
}

.weather-art {
  height: 86px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 69px;
  margin-top: 3px;
  filter: drop-shadow(0 5px 9px rgba(30,65,100,.12));
}

.weather-panel {
  margin-top: 22px;
  padding: 16px 14px;
  text-align: left;
  border-radius: 20px;
  background: rgba(28, 65, 113, .22);
  border: 1px solid rgba(255,255,255,.14);
  box-shadow: 0 5px 18px rgba(24,61,110,.05);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.weather-panel-title {
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,.75);
  margin-bottom: 14px;
  letter-spacing: .2px;
}

.weather-hourly {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  text-align: center;
}

.weather-hour {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  font-size: 12px;
}

.weather-hour .hour-time {
  color: rgba(255,255,255,.85);
  white-space: nowrap;
}

.weather-hour .hour-icon {
  font-size: 22px;
  height: 27px;
  display: flex;
  align-items: center;
}

.weather-hour .hour-temp {
  font-size: 16px;
  font-weight: 600;
}

.weather-summary {
  font-size: 13px;
  line-height: 1.65;
  color: rgba(255,255,255,.95);
  margin-top: 13px;
}

.weather-day {
  display: grid;
  grid-template-columns: 48px 26px 25px minmax(35px, 1fr) 25px;
  align-items: center;
  gap: 5px;
  min-height: 39px;
  font-size: 12px;
  border-bottom: 1px solid rgba(255,255,255,.14);
}

.weather-day:last-child {
  border-bottom: 0;
}

.weather-day-name {
  font-size: 13px;
  font-weight: 500;
}

.weather-day-icon {
  font-size: 17px;
  text-align: center;
}

.weather-day-low,
.weather-day-high {
  font-size: 12px;
  color: rgba(255,255,255,.88);
  text-align: center;
}

.weather-range {
  height: 4px;
  border-radius: 8px;
  background: rgba(255,255,255,.23);
  position: relative;
  overflow: hidden;
}

.weather-range::before {
  content: "";
  position: absolute;
  left: 18%;
  width: 65%;
  height: 100%;
  border-radius: 8px;
  background: linear-gradient(90deg, #9bd3f8, #ffe08b);
}

.weather-footer {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin-top: 20px;
  padding: 13px 10px 5px;
  border-top: 1px solid rgba(255,255,255,.25);
}

.weather-footer-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: rgba(255,255,255,.9);
  font-size: 10px;
}

.weather-footer-item .footer-icon {
  font-size: 20px;
}

.weather-footer-item.active {
  color: #fff;
  font-weight: 700;
}

  .calendar-screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  background: #f2f2f7;
  color: #1c1c1e;
  scrollbar-width: none;
}

.calendar-screen::-webkit-scrollbar {
  display: none;
}

.calendar-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 10px;
  background: rgba(242,242,247,.97);
  position: sticky;
  top: 0;
  z-index: 3;
}

.calendar-nav button {
  border: 0;
  background: transparent;
  color: #007aff;
  font-size: 16px;
  cursor: pointer;
}

.calendar-nav .calendar-nav-title {
  font-size: 17px;
  font-weight: 700;
  color: #1c1c1e;
}

.calendar-month-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 18px 12px;
}

.calendar-month-heading strong {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -.6px;
}

.calendar-month-heading button {
  border: 0;
  background: #e5e5ea;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  color: #007aff;
  font-size: 18px;
  cursor: pointer;
}

.calendar-weekdays,
.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  text-align: center;
}

.calendar-weekdays {
  padding: 0 8px 8px;
  color: #8e8e93;
  font-size: 12px;
  border-bottom: 1px solid #d1d1d6;
}

.calendar-weekdays span:first-child {
  color: #ff3b30;
}

.calendar-weekdays span:last-child {
  color: #007aff;
}

.calendar-days {
  padding: 8px;
  row-gap: 5px;
}

.calendar-day {

/* 암호가 틀렸을 때 흔들리는 효과 */
@keyframes passcode-shake {
  0%, 100% {

  20%, 60% {

  40%, 80% {

async function loadMusicCovers() {
  await Promise.all(musicSongs.map(async (song, i) => {
    try {
      const query = encodeURIComponent(
        `${song.title} ${song.artist}`
      );

      const response = await fetch(
        `https://itunes.apple.com/search?term=${query}&entity=song&limit=10&country=kr`
      );

      const data = await response.json();

      if (!data.results || !data.results.length) return;

      const title = song.title
        .toLowerCase()
        .replace(/\s+/g, "");

      const artist = song.artist
        .toLowerCase()
        .replace(/\s+/g, "");

      const match = data.results.find(track =>
        track.trackName.toLowerCase().replace(/\s+/g, "")
          .includes(title) &&
        track.artistName.toLowerCase().includes(artist)
      ) || data.results[0];

      song.coverUrl = match.artworkUrl100
        .replace(/\d+x\d+bb/, "600x600bb");

      const cover = document.querySelector(
        `.music-cover[data-song-index="${i}"]`
      );

      if (cover) {
        cover.innerHTML =
          `<img src="${song.coverUrl}" alt="앨범 커버">`;
      }

      if (i === currentMusicIndex) {
        const mini = document.querySelector(".music-mini-cover");

        if (mini) {
          mini.innerHTML =
            `<img src="${song.coverUrl}" alt="앨범 커버">`;
        }
      }
    } catch (error) {
      console.log("앨범 커버를 불러오지 못했습니다:", song.title);
    }
  }));
}

function updateMusicPlayer() {
  const song = musicSongs[currentMusicIndex];

  const miniCover = document.querySelector(".music-mini-cover");
  const playerBar = document.querySelector(".music-player-bar");
  const playerInfo = document.querySelector(".music-player-info");
  const playIcon = document.querySelector(".music-play-icon");

  if (!song || !miniCover || !playerBar || !playerInfo || !playIcon) return;

  miniCover.style.background = song.color;

  if (song.coverUrl) {
    miniCover.innerHTML = `
      <img src="${song.coverUrl}" alt="${song.title} 앨범 커버">
    `;
  } else {
    miniCover.textContent = song.cover;
  }

  playerInfo.innerHTML = `
    <div class="music-song-title">${song.title}</div>
    <div class="music-song-artist">${song.artist}</div>

  playIcon.textContent = musicIsPlaying ? "Ⅱ" : "▶";

  document.querySelectorAll(".music-song").forEach((item, i) => {
    const moreButton = item.querySelector(".music-more");

    if (moreButton) {
      moreButton.textContent =
        currentMusicIndex === i && musicIsPlaying ? "♫" : "•••";
    }
  });
}

function renderLockScreen() {
  content.innerHTML = `

         onclick="openPasscodePad(event)">

      ${
        showPasscodePad
          ? `

        <div class="passcode-dots">
          ${[0, 1, 2, 3].map(i =>
            `<span class="passcode-dot ${
              i < enteredPasscode.length ? "filled" : ""
            }"></span>`
          ).join("")}
        </div>

        <div class="number-pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button class="number-key"
              onclick="pressPasscode('${n}', event)">
              ${n}
            </button>
          `).join("")}

          <button class="delete-key"
            onclick="deletePasscode(event)">삭제</button>

          <button class="number-key"
            onclick="pressPasscode('0', event)">0</button>

          <button class="passcode-confirm"
            onclick="confirmPasscode(event)"
            ${enteredPasscode.length !== 4 ? "disabled" : ""}>
            확인
          </button>
        </div>

        <div class="passcode-error" id="lockError"></div>
      `
          : `
        <div class="lock-tap-hint">화면을 터치하여 잠금 해제</div>
      `
      }

      <div class="lock-notif">
        <div class="lock-notif-icon"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.2-.2 1.2-.8 2.5-1.8 3.5 1.9-.1 3.6-.8 4.8-1.8.8.2 1.6.3 2.4.3 5.5 0 10-3.6 10-8.2S17.5 3 12 3z"/></svg></div>
        <div class="lock-notif-body">
          <div class="lock-notif-title">메시지</div>
          <div class="lock-notif-text">2개의 새로운 알림</div>
        </div>
        <div class="lock-notif-time">오후 7:11</div>
      </div>

        <div class="lock-bottom-icon">⌁</div>
        <div class="lock-bottom-icon">◉</div>
      </div>
    </div>
  `;

  updateLockClock();

  if (lockClockInterval === null) {
    lockClockInterval = setInterval(updateLockClock, 1000);
  }
}

function updateLockClock() {
  const now = new Date();

  const dateElement = content.querySelector(".ios-lock-date");
  const clockElement = content.querySelector(".ios-lock-clock");

  if (dateElement) {
    dateElement.textContent = new Intl.DateTimeFormat("ko-KR", {
      month: "long",
      day: "numeric",
      weekday: "long"
    }).format(now);
  }

  if (clockElement) {
    clockElement.textContent = new Intl.DateTimeFormat("ko-KR", {
      hour: "2-digit",
      minute: "2-digit",
      hourCycle: "h23"
    }).format(now);
  }
}

let lockClockInterval = null;

function openPasscodePad(event) {
  if (event.target.closest("button")) return;
  if (!showPasscodePad) {
    showPasscodePad = true;
    renderLockScreen();
  }
}

function pressPasscode(number, event) {
  event.stopPropagation();

  if (enteredPasscode.length >= 4) return;

  enteredPasscode += number;
  renderLockScreen();
}

function deletePasscode() {
  enteredPasscode = enteredPasscode.slice(0, -1);
  renderLockScreen();
}

function confirmPasscode(event) {
  event.stopPropagation();

  if (enteredPasscode.length !== 4) return;

  if (enteredPasscode === LOCK_PASSCODE) {
    isLocked = false;
    home();
    return;
  }

  // 틀린 암호라면 오류 메시지를 표시하고 화면 흔들기
  enteredPasscode = "";
  renderLockScreen();

  const screen = content.querySelector(".ios-lock-screen");
  const error = content.querySelector("#lockError");

  if (error) {
    error.textContent = "암호가 올바르지 않습니다.";
  }

  if (screen) {
    screen.classList.remove("passcode-shake");

    // 브라우저가 애니메이션을 다시 시작하도록 강제
    void screen.offsetWidth;

    screen.classList.add("passcode-shake");
  }
}

function listTimeLabel(th) {
  // 내가 방금 대화했으면 "지금"
  if (th.justNow) return "지금";
  // 대화 안에 stamp가 있으면 마지막 stamp 사용, 없으면 기본 time
  let label = th.time || "";
  for (let i = th.msgs.length - 1; i >= 0; i--) {
    if (th.msgs[i].s === "stamp") { label = th.msgs[i].t; break; }
  }
  // 아이폰 목록처럼 "어제 오후 1:13" → "어제"
  if (label.startsWith("어제")) return "어제";
  return label;
}

function listPreview(th) {
  for (let i = th.msgs.length - 1; i >= 0; i--) {
    if (th.msgs[i].s !== "stamp") return th.msgs[i].t.replace(/\s*\n\s*/g, " ");
  }
  return "";
}

function chat(id) {
  currentChatId = id;
  if (id === 1) unreadJinho = 0;
  setAppBackground("#ffffff");
  const c = contacts.find(x => x.id === id);
  const th = threads[id];

  const person = `
    <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
      <circle cx="24" cy="18" r="8" fill="#fff" opacity=".92"/>
      <path d="M8 46c0-9 7-15 16-15s16 6 16 15z" fill="#fff" opacity=".92"/>
    </svg>`;

  let html = `
    <div class="imc-header">
      <div class="imc-back" onclick="messages()">
        <svg viewBox="0 0 12 20" width="11" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>

        <div class="imc-name">${c.name}

        </div>
      </div>
    </div>

    <div class="chat" id="chatMessages">
      <div class="stamp">${th.time}</div>
  `;

  for (const m of th.msgs) {
    if (m.s === "stamp") {
      html += `<div class="stamp">${m.t}</div>`;
    } else {
      html += `<div class="bubble ${m.s}">${m.t.replace(/\n/g, "<br>")}</div>`;
    }
  }

  html += `

function gptEscape(text) {

function searchGoogle(event) {
  event.preventDefault();

  const input = document.getElementById("googleQuery");
  const results = document.getElementById("googleResults");
  const query = input.value.trim();

  if (!query) return;

  browserHistory = [
    query,
    ...browserHistory.filter(item => item !== query)
  ].slice(0, 10);

  const safeQuery = query.replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

  results.innerHTML = `
    <p>‘${safeQuery}’ 검색</p>
    <div class="google-result">
      <strong>Google 검색 결과</strong>
      <p>${safeQuery}에 관한 실제 검색 결과를 확인해 보세요.</p>
      <a href="https://www.google.com/search?q=${encodeURIComponent(query)}"
         target="_blank" rel="noopener noreferrer">
        Google에서 검색하기 ↗
      </a>
    </div>
    <div id="searchHistory"></div>
  `;
}

function sendMessage(event, id) {
  event.preventDefault();

  const input = document.getElementById("messageText");
  const text = input.value.trim();

  if (!text) return;

  // 입력창 비우기 전에 메시지 저장
  threads[id].msgs.push({
    s: "me",
    t: text
  });

  threads[id].justNow = true;

  // 내가 보낸 메시지를 즉시 표시
  chat(id);

  // 진호형에게만 자동 답장
  const contact = contacts.find(c => c.id === id);
  if (!contact || contact.name !== "진호형🤍") return;

  // "헤어져" / "헤어지"가 들어가면 진호형한테서 전화가 걸려옴
  if (text.includes("헤어져") || text.includes("헤어지")) {
    setTimeout(() => showIncomingCall(contact), 1500);
    return;
  }

  const replies = getAutoReply(text);
  if (!replies || replies.length === 0) return;

  // 답장을 시간차로 하나씩 추가
  replies.forEach((reply, index) => {
    setTimeout(() => {
      threads[id].msgs.push({
        s: "them",
        t: reply
      });

      threads[id].justNow = true;

      // 현재 보고 있는 대화가 진호형 대화라면 즉시 갱신
      if (String(currentChatId) === String(id)) {
        chat(id);
      }
    }, 1000 * (index + 1));
  });
}

function getAutoReply(message) {
  const text = message.toLowerCase().trim();

  if (text.includes("좋아해")) {
    return ["나도 좋아해 많이"];
  }

  if (text.includes("사랑해")) {
    return [
      "ㅋㅋㅋ",
      "나도 사랑해"
    ];
  }

  if (text.includes("보고싶") || text.includes("보고 싶")) {
    return ["나도 빨리 출구 너 보고싶어 죽겠다 야"];
  }

  if (text.includes("결혼")) {
    return [
      "ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ",
      "반지는 준비했지?"
    ];
  }

  return null;
}

let calendarYear = new Date().getFullYear();
let calendarMonth = new Date().getMonth();
let calendarSelectedDate = dateKey(new Date());

function dateKey(date) {
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}

function moveCalendarMonth(amount) {
  calendarMonth += amount;

  if (calendarMonth < 0) {
    calendarMonth = 11;
    calendarYear--;
  } else if (calendarMonth > 11) {
    calendarMonth = 0;
    calendarYear++;
  }

  renderCalendar();
}

function selectCalendarDate(key) {
  calendarSelectedDate = key;
  renderCalendar();
}
function addYearlyCalendarEvents() {
  for (let year = calendarYear - 5; year <= calendarYear + 5; year++) {
    const key = dateKey(new Date(year, 9, 31));

    if (!calendarEvents[key]) {
      calendarEvents[key] = [];
    }

    const alreadyExists = calendarEvents[key].some(
      event => event.title === "진호형 생일"
    );

    if (!alreadyExists) {
      calendarEvents[key].push({
        title: "진호형 생일",
        time: "종일",
        color: "orange"
      });
    }
  }
}

function renderCalendar() {
  setAppBackground("#f2f2f7");
  addYearlyCalendarEvents();
  const firstDay = new Date(calendarYear, calendarMonth, 1);
  const lastDay = new Date(calendarYear, calendarMonth + 1, 0);
  const todayKey = dateKey(new Date());

  const monthNames = [
    "1월", "2월", "3월", "4월", "5월", "6월",
    "7월", "8월", "9월", "10월", "11월", "12월"
  ];

  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  let daysHTML = "";

  // 월간 달력을 6주 기준으로 구성
  const startOffset = firstDay.getDay();
  const totalCells = Math.ceil(
    (startOffset + lastDay.getDate()) / 7
  ) * 7;

  for (let i = 0; i < totalCells; i++) {
    const dayNumber = i - startOffset + 1;
    const date = new Date(calendarYear, calendarMonth, dayNumber);
    const key = dateKey(date);
    const inMonth = date.getMonth() === calendarMonth;
    const isToday = key === todayKey;
    const isSelected = key === calendarSelectedDate;
    const hasEvents = (calendarEvents[key] || []).length > 0;

    const classes = [
      "calendar-day",
      !inMonth ? "outside" : "",
      isToday ? "today" : "",
      isSelected ? "selected" : ""
    ].filter(Boolean).join(" ");

    daysHTML += `
      <button class="${classes}"
        onclick="selectCalendarDate('${key}')">
        <span class="day-number">${date.getDate()}</span>
        <span class="calendar-dots">
          ${hasEvents ? "<i></i>" : ""}
        </span>
      </button>
    `;
  }

  const selectedDate = new Date(calendarSelectedDate + "T12:00:00");
  const selectedLabel =
    `${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일 ` +
    `${weekdays[selectedDate.getDay()]}요일`;

  const events = calendarEvents[calendarSelectedDate] || [];

  const eventsHTML = events.length
    ? events.map(event => `
        <div class="calendar-event">
          <div class="calendar-event-bar ${event.color === "purple" ? "purple" : event.color === "orange" ? "orange" : ""}"></div>
          <div class="calendar-event-info">
            <div class="calendar-event-title">${escapeCalendarText(event.title)}</div>
            <div class="calendar-event-time">${event.time}</div>
          </div>
        </div>
      `).join("")
    : `<div class="calendar-empty">예정된 일정이 없습니다.</div>`;

  content.innerHTML = `
    <div class="calendar-screen">
      <div class="calendar-nav">
        <button onclick="home()">‹ 홈</button>
        <span class="calendar-nav-title">캘린더</span>
        <button onclick="goCalendarToday()">오늘</button>
      </div>

      <div class="calendar-month-heading">
        <strong>${calendarYear}년 ${monthNames[calendarMonth]}</strong>
        <div>
          <button onclick="moveCalendarMonth(-1)">‹</button>
          <button onclick="moveCalendarMonth(1)">›</button>
        </div>
      </div>

      <div class="calendar-weekdays">
        ${weekdays.map(day => `<span>${day}</span>`).join("")}
      </div>

      <div class="calendar-days">
        ${daysHTML}
      </div>

      <div class="calendar-events">
        <div class="calendar-events-heading">${selectedLabel}</div>
        ${eventsHTML}

      </div>

    </div>
  `;

  content.scrollTop = 0;
}

function goCalendarToday() {
  const now = new Date();
  calendarYear = now.getFullYear();
  calendarMonth = now.getMonth();
  calendarSelectedDate = dateKey(now);
  renderCalendar();
}

function escapeCalendarText(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function calendarApp() {
  goCalendarToday();
}

let touchStartX = 0;
let touchStartY = 0;

function photoView(i) {
  setAppBackground("#000000");

  const p = photos[i];

  content.innerHTML = `
    <div class="header">
      <span class="back" onclick="gallery()">‹ 사진</span>
    </div>
    <div class="viewer" id="photoViewer"
      style="touch-action:pan-y;">
      <img src="${p}" alt="사진 ${i + 1}"
        style="width:100%;height:100%;object-fit:contain;">
    </div>
  `;

  content.scrollTop = 0;

  const viewer = document.getElementById("photoViewer");

  viewer.addEventListener("touchstart", e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  viewer.addEventListener("touchend", e => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;

    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && i < photos.length - 1) {
        photoView(i + 1);
      } else if (dx > 0 && i > 0) {
        photoView(i - 1);
      }
    }
  }, { passive: true });
}

const CALL_SCRIPT = [

  plus: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 6h10a2 2 0 012 2v2.5l4.5-2.8a.5.5 0 01.8.4v7.8a.5.5 0 01-.8.4L16 13.5V16a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5z"/></svg>'
};
const CALL_PHONE_SVG = '<svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/></svg>';
let callState = null;
// 새로 생긴 통화 기록 (최신이 맨 앞)
let callLog = [];
function nowCallTime() {
  const d = new Date();
  const h = d.getHours();
  return (h < 12 ? "오전 " : "오후 ") + (h % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0");
}
function addCallLog(contact, type) {
  const top = callLog[0];
  if (top && top.id === contact.id && top.type === type) {   // 연속 같은 기록은 (n)으로 묶기
    top.count++; top.time = nowCallTime();
  } else {
    callLog.unshift({ id: contact.id, name: contact.name, type, count: 1, time: nowCallTime() });
  }
}
function callLogRowsHTML() {
  return callLog.map(c => `
          <div class="call-row${c.type === "missed" ? " missed" : ""}">
            <div class="contact-avatar">
              <svg viewBox="0 0 40 40" aria-hidden="true">
                <circle cx="20" cy="13" r="7" fill="currentColor"/>
                <path d="M7 35c0-8 5-13 13-13s13 5 13 13" fill="currentColor"/>
              </svg>
            </div>
            <div class="call-info">
              <strong>${c.name}${c.count > 1 ? " (" + c.count + ")" : ""}</strong>
              <p>${c.type === "missed" ? "부재중 전화" : "휴대전화 · 수신"}</p>
            </div>
            <div class="call-time">${c.time}　›</div>
          </div>`).join("");
}

function showIncomingCall(contact) {
  if (callState) return;               // 이미 전화 중이면 무시
  callState = { contact, timers: [], interval: null, seconds: 0, overlay: null };

  const ov = document.createElement("div");
  ov.className = "call-overlay";
  ov.innerHTML = `
    <div class="call-top">
      <div class="call-name">${contact.name}</div>
      <div class="call-sub">휴대전화</div>
    </div>
    <div class="call-mini-row">
      <div class="call-mini"><i>${CALL_ICON.clock}</i>알림</div>
      <div class="call-mini"><i>${CALL_ICON.msg}</i>메시지</div>
    </div>
    <div class="call-main-row">
      <button class="call-btn decline" id="callDecline"><i>${CALL_PHONE_SVG}</i>거절</button>
      <button class="call-btn accept" id="callAccept"><i>${CALL_PHONE_SVG}</i>수락</button>
    </div>`;
  phoneScreen.appendChild(ov);
  phoneScreen.classList.add("in-call");
  callState.overlay = ov;

  ov.querySelector("#callDecline").onclick = declineCall;
  ov.querySelector("#callAccept").onclick = acceptCall;
}

function fmtCallTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return m + ":" + s;
}

function acceptCall() {
  if (!callState) return;
  const { contact, overlay } = callState;
  overlay.innerHTML = `
    <div class="call-top">
      <div class="call-name">${contact.name}</div>
      <div class="call-timer" id="callTimer">00:00</div>
    </div>
    <div class="call-caption-wrap"><div class="call-caption" id="callCaption"></div></div>
    <div class="call-keys call-keys-lift">
      <div class="call-mini"><i>${CALL_ICON.mute}</i>소리 끔</div>
      <div class="call-mini"><i>${CALL_ICON.keypad}</i>키패드</div>
      <div class="call-mini"><i>${CALL_ICON.speaker}</i>오디오</div>
      <div class="call-mini"><i>${CALL_ICON.plus}</i>통화 추가</div>
      <div class="call-mini"><i>${CALL_ICON.video}</i>FaceTime</div>
      <div class="call-mini"><i>${CALL_ICON.person}</i>연락처</div>
    </div>
    <div class="call-end-wrap">
      <button class="call-btn decline" id="callEnd"><i>${CALL_PHONE_SVG}</i></button>
    </div>`;
  callState.accepted = true;
  overlay.querySelector("#callEnd").onclick = () => endCall();

  // 통화 시간 증가
  callState.seconds = 0;
  const timerEl = overlay.querySelector("#callTimer");
  callState.interval = setInterval(() => {
    callState.seconds++;
    timerEl.textContent = fmtCallTime(callState.seconds);
  }, 1000);

  // 자막: 말 길이에 따라 표시 시간이 달라짐
  const cap = overlay.querySelector("#callCaption");
  let t = 900;                                   // 받고 나서 첫 말까지
  CALL_SCRIPT.forEach((line, idx) => {
    const speak = 900 + line.length * 190;       // 글자 수에 비례
    callState.timers.push(setTimeout(() => {
      cap.classList.remove("show");
      setTimeout(() => { cap.textContent = line; cap.classList.add("show"); }, 120);
    }, t));
    const lineEnd = t + speak;
    t = lineEnd + 450;                           // 말 사이 간격
    if (idx === CALL_SCRIPT.length - 1) {
      // 마지막 말이 끝나고 1초 뒤 자동으로 끊기
      callState.timers.push(setTimeout(() => endCall(), lineEnd + 1000));
    }
  });
}

function endCall() {
  if (!callState) return;
  const contact = callState.contact;
  if (callState.accepted) addCallLog(contact, "incoming");
  callState.timers.forEach(clearTimeout);
  if (callState.interval) clearInterval(callState.interval);
  callState.overlay.remove();
  phoneScreen.classList.remove("in-call");
  callState = null;
  chat(contact.id);                              // 문자 화면으로 복귀
}

function declineCall() {
  if (!callState) return;
  const contact = callState.contact;
  addCallLog(contact, "missed");
  endCall();
  // 거절하면 "전화받아" 문자 → 잠시 뒤 다시 전화
  setTimeout(() => {
    threads[contact.id].msgs.push({ s: "them", t: "전화 받아" });
    threads[contact.id].time = "지금";
    if (String(currentChatId) === String(contact.id)) chat(contact.id);
  }, 1000);
  setTimeout(() => showIncomingCall(contact), 2800);
}
</script>
</body>
